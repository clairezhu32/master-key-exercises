<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily affirmation cards for job seekers — rewire the mental blockers holding back your career.">
  <title>Affirmations — Lucky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --night: #080b17; --navy: #0e1327; --panel: #131a33; --panel-2: #19213d;
      --line: rgba(255,255,255,.1); --text: #f7f5ff; --muted: #a8adc2;
      --violet: #9d8cff; --violet-2: #725cff; --mint: #71e5c1; --warm: #ffd9a2;
      --max: 1180px;
    }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh; color: var(--text); font-family: "DM Sans", sans-serif;
      line-height: 1.6; -webkit-font-smoothing: antialiased;
      background: radial-gradient(circle at 82% 5%, rgba(114,92,255,.18), transparent 30rem),
        radial-gradient(circle at 8% 36%, rgba(113,229,193,.08), transparent 28rem), var(--night);
    }
    a { color: inherit; text-decoration: none; }
    .nav { width: min(var(--max), calc(100% - 40px)); height: 78px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: -.02em; font-size: 18px; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px;
      color: var(--night); background: linear-gradient(135deg, var(--mint), var(--violet));
      font-family: "Playfair Display", serif; font-size: 17px; font-weight: 600; }
    .nav-links { display: flex; align-items: center; gap: 24px; color: var(--muted); font-size: 13px; font-weight: 500; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--text); }
    .wrap { width: min(720px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 80px; }
    .eyebrow { color: var(--mint); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 12px; }
    h1 { font-family: "Playfair Display", serif; font-size: clamp(32px, 5vw, 46px); font-weight: 600; line-height: 1.15; margin-bottom: 12px; }
    .sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; border: 1px solid var(--line); border-radius: 99px; background: transparent;
      color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .tab.active { background: rgba(157,140,255,.14); border-color: var(--violet); color: var(--text); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .filter { padding: 8px 14px; border: 1px solid var(--line); border-radius: 99px; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .filter.active { background: rgba(113,229,193,.12); border-color: var(--mint); color: var(--text); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
      padding: 48px 40px; text-align: center; position: relative; min-height: 300px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .card-text { font-family: "Playfair Display", serif; font-size: clamp(22px, 4vw, 30px);
      line-height: 1.45; font-weight: 600; margin-bottom: 16px; }
    .card-blocker { color: var(--mint); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .card-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
    .nav-btn { padding: 12px 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
      color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .nav-btn:hover { border-color: var(--violet); }
    .nav-btn:disabled { opacity: .35; cursor: default; }
    .counter { color: var(--muted); font-size: 13px; }
    .save-btn { margin-top: 20px; padding: 12px 28px; border-radius: 99px; border: 1px solid rgba(157,140,255,.45);
      background: rgba(157,140,255,.08); color: var(--text); font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; }
    .save-btn.saved { background: rgba(113,229,193,.14); border-color: var(--mint); }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    .empty p { margin-bottom: 16px; }
    @media (max-width: 600px) { .card { padding: 36px 24px; } .nav-links { gap: 14px; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/"><span class="brand-mark">L</span> Lucky</a>
    <div class="nav-links">
      <a href="/goals">My plan</a>
      <a href="/affirmations" class="active">Affirmations</a>
      <a href="/visualization">Daily visualization</a>
    </div>
  </nav>

  <div class="wrap">
    <div class="eyebrow">Mindset practice</div>
    <h1>Affirmation cards</h1>
    <p class="sub">One card at a time. Read it slowly, say it out loud, let it land. Save the ones that hit home.</p>

    <div class="tabs">
      <button class="tab active" data-tab="browse">Browse all</button>
      <button class="tab" data-tab="saved">Saved (<span id="saved-count">0</span>)</button>
    </div>

    <div class="filters" id="filters"></div>

    <div class="card" id="card">
      <div class="card-blocker" id="card-blocker"></div>
      <div class="card-text" id="card-text" style="margin-top:12px"></div>
    </div>

    <div class="card-nav">
      <button class="nav-btn" id="prev-btn">← Prev</button>
      <span class="counter" id="counter"></span>
      <button class="nav-btn" id="next-btn">Next →</button>
    </div>
    <div style="text-align:center">
      <button class="save-btn" id="save-btn">♡ Save this card</button>
    </div>
    <div class="empty" id="empty" style="display:none">
      <p>No saved cards yet. Browse and tap ♡ on the ones that resonate.</p>
    </div>
  </div>

  <script src="/js/affirmations-data.js"></script>
  <script>
    (function() {
      var BLOCKER_LABELS = {
        not_qualified: "Not qualified enough",
        fear_freeze: "Freezing in interviews",
        imposter: "Imposter syndrome",
        rejection: "Fear of rejection",
        direction: "Lost direction",
        competition: "Tough competition",
        networking: "Networking anxiety",
        confidence: "Low confidence"
      };

      var tab = "browse";
      var filter = "all";
      var index = 0;
      var savedIds = [];
      try { savedIds = JSON.parse(localStorage.getItem("lucky_saved_affirmations") || "[]"); } catch(e) {}

      var filtersEl = document.getElementById("filters");
      var cardEl = document.getElementById("card");
      var emptyEl = document.getElementById("empty");
      var textEl = document.getElementById("card-text");
      var blockerEl = document.getElementById("card-blocker");
      var counterEl = document.getElementById("counter");
      var prevBtn = document.getElementById("prev-btn");
      var nextBtn = document.getElementById("next-btn");
      var saveBtn = document.getElementById("save-btn");
      var savedCountEl = document.getElementById("saved-count");

      // Build filter pills
      var filterDefs = [{ id: "all", label: "All" }];
      Object.keys(BLOCKER_LABELS).forEach(function(k) {
        filterDefs.push({ id: k, label: BLOCKER_LABELS[k] });
      });
      filterDefs.forEach(function(f) {
        var b = document.createElement("button");
        b.className = "filter" + (f.id === "all" ? " active" : "");
        b.textContent = f.label;
        b.dataset.filter = f.id;
        b.onclick = function() {
          filter = f.id; index = 0;
          document.querySelectorAll(".filter").forEach(function(x) { x.classList.remove("active"); });
          b.classList.add("active");
          render();
        };
        filtersEl.appendChild(b);
      });

      // Tabs
      document.querySelectorAll(".tab").forEach(function(t) {
        t.onclick = function() {
          tab = t.dataset.tab; index = 0;
          document.querySelectorAll(".tab").forEach(function(x) { x.classList.remove("active"); });
          t.classList.add("active");
          filtersEl.style.display = tab === "browse" ? "flex" : "none";
          render();
        };
      });

      function getPool() {
        if (tab === "saved") {
          return AFFIRMATIONS.filter(function(a) { return savedIds.indexOf(a.id) >= 0; });
        }
        if (filter === "all") return AFFIRMATIONS;
        return AFFIRMATIONS.filter(function(a) { return a.blocker === filter; });
      }

      function persistSaved() {
        try { localStorage.setItem("lucky_saved_affirmations", JSON.stringify(savedIds)); } catch(e) {}
        savedCountEl.textContent = savedIds.length;
      }

      function render() {
        var pool = getPool();
        savedCountEl.textContent = savedIds.length;
        if (pool.length === 0) {
          cardEl.style.display = "none";
          document.querySelector(".card-nav").style.display = "none";
          saveBtn.style.display = "none";
          emptyEl.style.display = "block";
          return;
        }
        cardEl.style.display = "flex";
        document.querySelector(".card-nav").style.display = "flex";
        saveBtn.style.display = "";
        emptyEl.style.display = "none";

        if (index >= pool.length) index = 0;
        if (index < 0) index = pool.length - 1;
        var card = pool[index];
        textEl.textContent = "\u201C" + card.text + "\u201D";
        blockerEl.textContent = BLOCKER_LABELS[card.blocker] || card.blocker;
        counterEl.textContent = (index + 1) + " / " + pool.length;
        prevBtn.disabled = pool.length <= 1;
        nextBtn.disabled = pool.length <= 1;

        var isSaved = savedIds.indexOf(card.id) >= 0;
        saveBtn.textContent = isSaved ? "♥ Saved" : "♡ Save this card";
        saveBtn.classList.toggle("saved", isSaved);
        saveBtn.onclick = function() {
          var i = savedIds.indexOf(card.id);
          if (i >= 0) savedIds.splice(i, 1);
          else savedIds.push(card.id);
          persistSaved();
          render();
        };
      }

      prevBtn.onclick = function() { index--; render(); };
      nextBtn.onclick = function() { index++; render(); };

      // Keyboard
      document.addEventListener("keydown", function(e) {
        if (e.key === "ArrowLeft") { index--; render(); }
        if (e.key === "ArrowRight") { index++; render(); }
      });

      persistSaved();
      render();
    })();
  </script>
</body>
</html>

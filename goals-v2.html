<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Build Your 90-Day Master Plan — Master Key</title></head><body><div>Loading your Master Plan builder…</div><script>
(async()=>{try{
const r=await fetch('/goals.html',{cache:'no-store'}); if(!r.ok) throw new Error('load failed'); let h=await r.text();
function replaceStep(n,next,block){const s=h.indexOf('<div id="step-'+n+'"'); if(s<0)return; const e=h.indexOf(next,s); if(e<0)return; h=h.slice(0,s)+block+'\n    '+h.slice(e);}
const step=(n,q,hint,field,back,btn,dots)=>`<div id="step-${n}" class="step${n===1?' active':''}"><div class="step-hero"><div class="step-num">Step ${n} of 8</div><div class="step-q">${q}</div><div class="step-hint">${hint}</div>${field}</div><div class="step-nav">${n>1?`<button class="btn-back" onclick="goStep(${n-1})">← Back</button>`:'<span></span>'}<div class="dots">${dots}</div><button class="btn-next" id="btn-${n}" ${n===1?'disabled':''}>${n===8?'Generate My Plan →':'Continue →'}</button></div></div>`;
const dots=(n)=>Array.from({length:8},(_,i)=>`<div class="dot ${i<n-1?'done ':''}${i===n-1?'active':''}"></div>`).join('');
replaceStep(1,'<div id="step-2"',step(1,'What area of your life are you ready to transform?','Choose the area where a meaningful 90-day breakthrough would matter most.','<div class="category-grid"><button class="category-btn" data-category="Career breakthrough">Career breakthrough</button><button class="category-btn" data-category="Financial abundance">Financial abundance</button><button class="category-btn" data-category="Relationship &amp; connection">Relationship &amp; connection</button><button class="category-btn" data-category="Health &amp; energy">Health &amp; energy</button><button class="category-btn" data-category="Launching something of my own">Launching something of my own</button><button class="category-btn" data-category="Inner peace">Inner peace</button></div>','', '',dots(1)));
replaceStep(2,'<div id="step-3"',step(2,'What would a meaningful win look like 90 days from now?','Make it concrete. What would be visibly different if these 90 days went exceptionally well?','<textarea id="input-goal" placeholder="In 90 days, I would have…" maxlength="500"></textarea>','', '',dots(2)));
replaceStep(3,'<div id="step-4"',step(3,'Where are you today?','Tell the truth about your starting point — what is already working, what is unfinished, and what is currently true.','<textarea id="input-why" placeholder="Today, my situation is…" maxlength="700"></textarea>','', '',dots(3)));
replaceStep(4,'<div id="step-5"',step(4,'What needs to change to get from here to there?','Think about the real gap: skills, habits, relationships, resources, decisions, opportunities, or beliefs.','<textarea id="input-progress" placeholder="The biggest changes I need are…" maxlength="700"></textarea>','', '',dots(4)));
replaceStep(5,'<div id="step-6"',step(5,'What have you already tried — and what happened?','This keeps your Master Plan from repeating strategies that have already failed or been exhausted.','<textarea id="input-obstacle-detail" placeholder="I have tried… The result was…" maxlength="800"></textarea><select id="input-obstacle-reason" style="display:none"><option value="What I have already tried" selected>What I have already tried</option></select>','', '',dots(5)));
replaceStep(6,'<div id="step-7"',step(6,'What strengths, resources, relationships, or opportunities can you leverage?','A Master Plan should build from what you already have — not assume you are starting from zero.','<textarea id="input-leverage" placeholder="I can leverage…" maxlength="700"></textarea><div class="start-week-field"><div class="start-week-label">How much time can you realistically commit each week?</div><div class="hours-grid"><button class="hours-btn" data-hours="1-2">1–2 hours</button><button class="hours-btn" data-hours="3-5">3–5 hours</button><button class="hours-btn" data-hours="5-10">5–10 hours</button><button class="hours-btn" data-hours="10+">10+ hours</button></div></div><div class="start-week-field"><div class="start-week-label">Already partway through the course? Set which week this plan should start counting from.</div><select id="input-start-week"><option value="1" selected>Week 1 — starting fresh</option><option value="2">Week 2</option><option value="3">Week 3</option><option value="4">Week 4</option><option value="5">Week 5</option><option value="6">Week 6</option><option value="7">Week 7</option><option value="8">Week 8</option><option value="9">Week 9</option><option value="10">Week 10</option><option value="11">Week 11</option><option value="12">Week 12</option></select></div>','', '',dots(6)));
replaceStep(7,'<div id="step-8"',step(7,'What can you realistically commit — and what must you protect?','Name the constraints the plan must respect: family, health, money, work, relationships, weekends, or anything else non-negotiable.','<textarea id="input-constraints" placeholder="I can commit to… I need to protect…" maxlength="700"></textarea><input type="hidden" id="input-belief" value="7">','', '',dots(7)));
replaceStep(8,'<!-- ── Generating',step(8,'Why does this matter — and what could realistically derail you?','Connect the goal to what matters most, then name the failure modes the plan should help you anticipate.','<textarea id="input-why-final" placeholder="This matters because…" maxlength="500"></textarea><div class="obstacle-detail-field"><textarea id="input-derail" placeholder="What could derail me is…" maxlength="500"></textarea></div><button class="google-btn" id="step8-google-btn">Continue with Google</button><button class="btn-next step8-generate-btn" id="btn-8-generate" style="display:none">Generate My Plan →</button>','','',dots(8)));
h=h.replace('Answer 8 focused questions','Answer 8 strategic questions').replace('Reading your goal','Reading your goal and current reality').replace('Selecting exercises for your obstacle','Selecting exercises for your highest-leverage gap').replace('Finalizing your roadmap','Finalizing your 90-day strategy');
const override=`<script>\n(function(){function collectGoalData(){const startWeek=parseInt(document.getElementById('input-start-week')?.value,10)||1;const createdAt=Date.now()-(startWeek-1)*7*24*60*60*1000;const win=document.getElementById('input-goal').value.trim();const reality=document.getElementById('input-why').value.trim();const gap=document.getElementById('input-progress').value.trim();const tried=document.getElementById('input-obstacle-detail').value.trim();const leverage=document.getElementById('input-leverage').value.trim();const constraints=document.getElementById('input-constraints').value.trim();const why=document.getElementById('input-why-final').value.trim();const derail=document.getElementById('input-derail').value.trim();return{category:selectedCategory,goal:win,why:[why?'WHY: '+why:'',reality?'CURRENT REALITY: '+reality:''].filter(Boolean).join('\\n\\n'),progress:['90-DAY WIN: '+win,gap?'GAP TO CLOSE: '+gap:''].filter(Boolean).join('\\n\\n'),obstacle:[tried?'ALREADY TRIED: '+tried:'',leverage?'LEVERAGE: '+leverage:'',constraints?'CONSTRAINTS: '+constraints:'',derail?'DERAILERS: '+derail:''].filter(Boolean).join('\\n\\n'),hours:selectedHours,start_week:startWeek,belief_score:7,email:currentUser?.email??null,createdAt};}window.collectGoalData=collectGoalData;})();\n</script>`;
h=h.replace('</body>',override+'</body>'); document.open();document.write(h);document.close();
}catch(e){document.body.innerHTML='<div style="padding:40px;color:#f7f5ff;font-family:Arial">Could not load the Master Plan builder. Please refresh.</div>';console.error(e)}})();
</script></body></html>
